# 打一个 tag 就把客户端发出去 —— 之后下载页和自动更新**全自动**跟上
#
#     git tag v0.1.2 && git push origin v0.1.2
#
# 做三件事：
#   1. 在 macOS / Windows 上分别打包并**签名**（Tauri 的更新包必须签名）
#   2. 把安装包、更新包、签名文件传到 GitHub Release
#   3. 服务端读这个 Release → 下载页与自动更新清单立刻生效
#
# 人不需要传任何文件到服务器。这是刻意的：凡是"每次发版都要人记得做一步"
# 的流程，早晚会漏。

name: 发布客户端

on:
  push:
    tags:
      - "v*"
  # 也允许手动跑一次（比如 tag 打错了要重发）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.1.2）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响别的平台 —— 至少能发出一部分，而不是全军覆没
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS · Apple 芯片
            args: "--target aarch64-apple-darwin"
            rusttarget: aarch64-apple-darwin
          - os: macos-15-intel
            label: macOS · Intel
            args: "--target x86_64-apple-darwin"
            rusttarget: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
            rusttarget: ""

    steps:
      - uses: actions/checkout@v4

      # ⚠️ **不要**在这里写 `with: version:` —— package.json 里已有
      # `packageManager: pnpm@10.23.0`，两处同时指定会让 action 报
      # "Multiple versions of pnpm specified" 而直接失败。
      # 让 action 自己读 package.json 就够了，版本也只有一个来源。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rusttarget }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: 把版本号同步进 tauri.conf.json 与 Cargo.toml
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = (process.env.VERSION_INPUT || process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            if (!/^\\d+\\.\\d+\\.\\d+$/.test(v)) { console.error("版本号不合法: " + v); process.exit(1); }

            const tp = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(tp, "utf8"));
            conf.version = v;
            fs.writeFileSync(tp, JSON.stringify(conf, null, 2) + "\n");

            // ⚠️ 这里刻意不用 sed。
            // 原来写的是 `sed "0,/^version = /s//version = \"$V\"/"` ——
            // `s//repl/` 只替换匹配到的那一小段（`version = `），**原来的版本号会留在后面**，
            // 结果变成 `version = "0.1.1""0.1.1"`，Cargo 报 TOML 解析错误。
            const cp = "apps/desktop/src-tauri/Cargo.toml";
            fs.writeFileSync(cp, fs.readFileSync(cp, "utf8").replace(/^version = "[^"]+"/m, `version = "${v}"`));

            console.log("版本已同步为 " + v);
          '
      - name: 打包（含签名）
        env:
          # ⚠️ 这两个是 GitHub 仓库 Secrets。私钥**绝不能**进代码库：
          # 有它就能签出装到全公司机器上的程序。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 同步服务器地址烧进安装包（用户不需要、也没法填）
          VITE_KUAIBAN_SERVER: https://kuaiban.bonnei.com
        run: pnpm --filter @kuaiban/desktop tauri build ${{ matrix.args }}

      - name: 把架构写进 macOS 更新包的文件名
        # Tauri 打出来的更新包叫 `KuaiBan.app.tar.gz`，**文件名里没有架构信息**
        # （架构只在目录名上，传到 Release 就丢了）。服务端据此区分芯片，
        # 分不清就只能不发 —— 而"发错芯片的包"对用户是致命的。
        #
        # ⚠️ 用 node 而不是 shell：
        # 原来写的 `[ -z "$arch" ] && arch="x64"` 在 arch **非空**时这个表达式返回 1，
        # 被 GitHub Actions 默认的 `set -e` 直接终止脚本（Apple 芯片那台就是这么挂的）。
        if: startsWith(matrix.os, 'macos')
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const roots = ["apps/desktop/src-tauri/target"];
            const hits = [];
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (/\.app\.tar\.gz(\.sig)?$/.test(e.name)) hits.push(p);
              }
            };
            for (const r of roots) if (fs.existsSync(r)) walk(r);

            for (const p of hits) {
              const arch = p.includes("aarch64") ? "aarch64" : "x64";
              const next = path.join(path.dirname(p), path.basename(p).replace(/\.app\.tar\.gz/, `_${arch}.app.tar.gz`));
              // 已经改过名的跳过（重跑时不会二次改名）
              if (p === next) continue;
              fs.renameSync(p, next);
              console.log("→ " + path.basename(next));
            }
            console.log("共处理 " + hits.length + " 个文件");
          '
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          # 安装包（给人下）+ 更新包与签名（给自动更新用）
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.nsis.zip
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: 发 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出要发的文件（出问题时一眼看得出缺了什么）
        run: ls -la artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          # 手动触发时 tag 可能还不存在
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: false
          prerelease: false
