# 打一个 tag 就把客户端发出去 —— 之后下载页和自动更新**全自动**跟上
#
#     git tag v0.1.2 && git push origin v0.1.2
#
# 做三件事：
#   1. 在 macOS / Windows 上分别打包并**签名**（Tauri 的更新包必须签名）
#   2. 把安装包、更新包、签名文件传到 GitHub Release
#   3. 服务端读这个 Release → 下载页与自动更新清单立刻生效
#
# 人不需要传任何文件到服务器。这是刻意的：凡是"每次发版都要人记得做一步"
# 的流程，早晚会漏。

name: 发布客户端

on:
  push:
    tags:
      - "v*"
  # 也允许手动跑一次（比如 tag 打错了要重发）
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.1.2）"
        required: true
        type: string
      server_only:
        description: "只构建服务端镜像（不动客户端）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # server_only 时跳过客户端打包（纯服务端改动不该惊动同事去更新客户端）
    if: ${{ github.event_name == 'push' || inputs.server_only != true }}
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不影响别的平台 —— 至少能发出一部分，而不是全军覆没
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS · Apple 芯片
            args: "--target aarch64-apple-darwin"
            rusttarget: aarch64-apple-darwin
          - os: macos-15-intel
            label: macOS · Intel
            args: "--target x86_64-apple-darwin"
            rusttarget: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ""
            rusttarget: ""

    steps:
      - uses: actions/checkout@v4

      # ⚠️ **不要**在这里写 `with: version:` —— package.json 里已有
      # `packageManager: pnpm@10.23.0`，两处同时指定会让 action 报
      # "Multiple versions of pnpm specified" 而直接失败。
      # 让 action 自己读 package.json 就够了，版本也只有一个来源。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rusttarget }}

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: 把版本号同步进 tauri.conf.json 与 Cargo.toml
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: node scripts/ci-set-version.mjs

      - name: 打包（含签名）
        env:
          # ⚠️ 这两个是 GitHub 仓库 Secrets。私钥**绝不能**进代码库：
          # 有它就能签出装到全公司机器上的程序。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 同步服务器地址烧进安装包（用户不需要、也没法填）
          VITE_KUAIBAN_SERVER: https://kuaiban.bonnei.com
        run: pnpm --filter @kuaiban/desktop tauri build ${{ matrix.args }}

      - name: 把架构写进 macOS 更新包的文件名
        # Tauri 的更新包文件名里没有架构信息，服务端靠它区分芯片 ——
        # 分不清就只能不发，因为发错芯片的包用户打不开。
        if: startsWith(matrix.os, 'macos')
        run: node scripts/ci-rename-updater-artifacts.mjs

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          # 安装包（给人下）+ 更新包与签名（给自动更新用）
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.nsis.zip
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  server-image:
    # ─────────────────────────────────────────────────────────
    # 服务端镜像也在这里一起构建 —— **这是让"后台一键升级"能用的关键**
    #
    # 后台升级的逻辑是"读 GitHub Release 的版本号 → 把镜像换成
    # <镜像名>:<那个版本号>"。所以**服务端镜像的 tag 必须与 Release 版本一致**，
    # 否则后台会去找一个不存在的镜像。
    #
    # 以前我是在本地手动 build/push、tag 还随手起（0.1.3/0.1.4/0.1.5），
    # 和客户端版本号根本不是一套 —— 后台升级只能靠碰巧。现在统一由一个
    # tag 驱动，版本号天然对齐。
    # ─────────────────────────────────────────────────────────
    name: 构建服务端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 解析版本号
        id: v
        shell: bash
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then V="$VERSION_INPUT"; else V="${GITHUB_REF#refs/tags/v}"; fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "版本：$V"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          # 服务器是 x86_64；在 arm 机器上构建必须显式指定
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/kuaiban-server:${{ steps.v.outputs.VERSION }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/kuaiban-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: ${{ github.event_name == 'push' || inputs.server_only != true }}
    name: 发 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # ⚠️ **必须限定只下载我们的产物**。
          # `docker/build-push-action` 的 `cache-to: type=gha` 会额外产生一个
          # `<repo>~<branch>~<id>.dockerbuild` 缓存产物；不加过滤就会把它
          # 也当发布产物下载，解压失败 →
          # "Unable to download and extract artifact: Artifact download failed after 5 retries"。
          # 而这个报错看起来像网络问题，很容易误判成偶发失败去重跑。
          pattern: bundle-*

      - name: 列出要发的文件（出问题时一眼看得出缺了什么）
        run: ls -la artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          # 手动触发时 tag 可能还不存在
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: false
          prerelease: false
