[package]
name = "desktop"
version = "0.1.0"
description = "快办 — 桌面待办清单"
authors = ["KuaiBan"]
edition = "2021"

[lib]
# `_lib` 后缀是为了让 lib 名与 bin 名不冲突（Windows 上的历史问题）
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon      ：系统托盘
# image-png      ：把 PNG 图标加载进托盘
# macos-private-api：macOS 上实现真正透明窗口的前提（Windows 上无副作用）
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─────────────────────────────────────────────────────────────
# Windows 专属：实现「不抢焦点」（WS_EX_NOACTIVATE）
# 这是整个项目唯一需要写平台代码的地方，且被隔离在本层，
# 绝不允许泄漏到 packages/core（大脑）。
# ─────────────────────────────────────────────────────────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
