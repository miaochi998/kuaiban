[package]
name = "desktop"
version = "0.1.18"
description = "快办 — 桌面待办清单"
authors = ["KuaiBan"]
edition = "2021"

[lib]
# `_lib` 后缀是为了让 lib 名与 bin 名不冲突（Windows 上的历史问题）
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon      ：系统托盘
# image-png      ：把 PNG 图标加载进托盘
# macos-private-api：macOS 上实现真正透明窗口的前提（Windows 上无副作用）
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-opener = "2"
# 在线更新：应用自己检查、下载、验签、安装新版本
tauri-plugin-updater = "2"
# 装完新版之后重启自己
tauri-plugin-process = "2"
# 单实例：防止用户重复启动导致两个挂件各持一份内存副本、互相看不到对方的改动
tauri-plugin-single-instance = "2"
# 本地持久化。sqlite 特性会带进 sqlx 的 SQLite 驱动。
# 用 SQLite 而不是别的：单文件、快、用户换电脑直接拷走就能带走全部数据。
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─────────────────────────────────────────────────────────────
# Windows 专属：实现「不抢焦点」（WS_EX_NOACTIVATE）+「按需可输入」
# 这是整个项目唯一需要写平台代码的地方，且被隔离在本层，
# 绝不允许泄漏到 packages/core（大脑）。
#
# windows 版本（0.62）刻意与 tauri 2.12 自己依赖的版本对齐（tauri 用 0.62）。
# 背景：`window.hwnd()` 返回的是 **tauri 那份 windows crate** 的 HWND，
# 而本 crate 原来声明的是 0.58，靠 `handle.0 as _` 把裸指针硬转过去。
# 实测（Windows 11 26300 + rustc 1.91）这段能编过，但它把"两个版本里 HWND 都是
# `pub *mut c_void`"当成了隐含契约，而且会同时编译两份 windows crate。
# 现在：HWND 一律通过 raw-window-handle 取（见 lib.rs::hwnd_of），与 crate 版本无关；
# windows 版本对齐到 0.62，只保留一份。
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# macOS 专属：修「不点一下就不响应悬停」
#
# NSWindow 的 acceptsMouseMovedEvents 默认是 false，而 AppKit 只在窗口是
# key window 时才无条件投递 mouseMoved。挂件是辅助窗口、永远不是 key，
# 于是 WebView 收不到鼠标移动 → CSS :hover 一直不更新。
# objc2 本来就在 tauri 的依赖树里（0.6.4），加它不增加编译成本。
# ─────────────────────────────────────────────────────────────
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# 只交换裸指针，跨 windows crate 版本稳定，用来从 Tauri 窗口拿原生 HWND
raw-window-handle = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
