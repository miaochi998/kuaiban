# 快办服务端 —— Portainer 堆栈
#
# 在 Portainer 里：Stacks → Add stack → 粘贴本文件内容（或指向本仓库的路径）。
#
# ## 运维的硬性要求（必须遵守）
#
# 1. **只能用 Portainer 的 Stack 方式部署**，不能用 docker run 或脱离面板的裸 compose
# 2. 部署后必须能在面板里**看到、启停、重建（re-pull & redeploy）、改环境变量**
#    —— 本文件把镜像、端口、域名等都做成 `${...}` 变量，正是为了这一点：
#       镜像换版本、端口调整都在面板上改，不用改文件
# 3. **Stack 名称固定**：测试机 `kuaiban-test`（192.168.2.6）/ 生产机 `kuaiban-production`（192.168.2.10）
# 4. **部署后不要改容器名 / 项目名**（运维有因改名导致卷重建、丢数据的前例）
# 5. 数据用**宿主机目录** `/opt/kuaiban/data`（不是命名卷）——
#    这样即使改名也不会丢数据。这个设计要保持。
#
# ## 这个堆栈在整条链路里的位置
#
#   员工 → https://kuaiban.bonnei.com (443)
#          └→ 阿里云 NPM（终止 HTTPS）
#             └→ http://<动态域名>:6520   ← 路由器端口映射到本机 8787
#                └→ 本堆栈
#
# 所以这里**只需要监听一个普通端口**，HTTPS 由阿里云那台 NPM 负责。

services:
  kuaiban:
    # 用预先构建好并推到镜像仓库的镜像（推荐）。
    # 改成你自己的仓库地址，例如：
    #   image: registry.cn-hangzhou.aliyuncs.com/你的命名空间/kuaiban-server:0.1.1
    image: ${KUAIBAN_IMAGE:-kuaiban-server:latest}
    # 刻意**不写死 container_name**：让 Compose 按 Stack 名派生
    # （kuaiban-test-kuaiban-1 / kuaiban-production-kuaiban-1），
    # 在面板里一眼看得出容器属于哪个 Stack，也更贴近运维既有的命名风格。
    # 反正数据在宿主机目录里，改名也不会丢。

    # 只在局域网暴露。**不要**直接映射到公网 —— 公网入口统一走阿里云的 NPM，
    # 那台机器负责 HTTPS 和证书续期，本机不碰这些。
    ports:
      - "${KUAIBAN_PORT:-6520}:6520"

    environment:
      # 对外域名：下载页和自动更新清单里的地址都从它拼出来。
      # 换域名只改这一处，不用重新发版。
      KUAIBAN_PUBLIC_ORIGIN: "https://kuaiban.bonnei.com"

      # 管理员密码：**只在第一次启动时用来建账号**。
      # 账号建好之后就改掉或删掉这个变量（密码存在数据库里）。
      KUAIBAN_ADMIN_PASSWORD: "${KUAIBAN_ADMIN_PASSWORD}"

      # 当前版本号：界面上"当前版本 x.y.z"读的就是它。
      # 升级时由后台改 KUAIBAN_IMAGE，这里同步改一下即可。
      KUAIBAN_VERSION: "${KUAIBAN_VERSION:-0.1.1}"

      # ⚠️ 这两项必须在这里显式写出来。
      # Portainer 的 Stack 环境变量**只是给 compose 做变量替换用的** ——
      # 没在 compose 里写 ${VAR} 的地方，那个变量就不会进容器。
      # （一开始漏了这两行，结果服务器拿不到 GitHub 配置，
      #   下载页永远是空的，而且日志上完全看不出问题。）
      KUAIBAN_GITHUB_REPO: "${KUAIBAN_GITHUB_REPO}"
      KUAIBAN_GITHUB_TOKEN: "${KUAIBAN_GITHUB_TOKEN}"

      KUAIBAN_DB: /data/kuaiban.db
      KUAIBAN_RELEASES_DIR: /data/releases
      PORT: "6520"

    volumes:
      # ⚠️ 用**宿主机目录**而不是 Docker 命名卷，是刻意的：
      #   1. 发版时只要 rsync 到 /opt/kuaiban/data/releases/ 就完事
      #   2. 备份就是打包 /opt/kuaiban 一个目录（数据库 + 发布包 + 签名密钥都在这儿）
      #   命名卷还得进容器里拷，运维上麻烦得多。
      - /opt/kuaiban/data:/data

    restart: unless-stopped

    # 日志别无限涨：内部工具，30MB 足够回看问题了
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
