# 快办服务端 —— Portainer 堆栈
#
# 在 Portainer 里：Stacks → Add stack → 粘贴本文件内容（或指向本仓库的路径）。
#
# ## 这个堆栈在整条链路里的位置
#
#   员工 → https://kuaiban.bonnei.com (443)
#          └→ 阿里云 NPM（终止 HTTPS）
#             └→ http://<动态域名>:6520   ← 路由器端口映射到本机 8787
#                └→ 本堆栈
#
# 所以这里**只需要监听一个普通端口**，HTTPS 由阿里云那台 NPM 负责。

services:
  kuaiban:
    # 用预先构建好并推到镜像仓库的镜像（推荐）。
    # 改成你自己的仓库地址，例如：
    #   image: registry.cn-hangzhou.aliyuncs.com/你的命名空间/kuaiban-server:0.1.1
    image: ${KUAIBAN_IMAGE:-kuaiban-server:latest}
    container_name: kuaiban

    # 只在局域网暴露。**不要**直接映射到公网 —— 公网入口统一走阿里云的 NPM，
    # 那台机器负责 HTTPS 和证书续期，本机不碰这些。
    ports:
      - "${KUAIBAN_PORT:-6520}:6520"

    environment:
      # 对外域名：下载页和自动更新清单里的地址都从它拼出来。
      # 换域名只改这一处，不用重新发版。
      KUAIBAN_PUBLIC_ORIGIN: "https://kuaiban.bonnei.com"

      # 管理员密码：**只在第一次启动时用来建账号**。
      # 账号建好之后就改掉或删掉这个变量（密码存在数据库里）。
      KUAIBAN_ADMIN_PASSWORD: "${KUAIBAN_ADMIN_PASSWORD}"

      KUAIBAN_DB: /data/kuaiban.db
      KUAIBAN_RELEASES_DIR: /data/releases
      PORT: "6520"

    volumes:
      # ⚠️ 用**宿主机目录**而不是 Docker 命名卷，是刻意的：
      #   1. 发版时只要 rsync 到 /opt/kuaiban/data/releases/ 就完事
      #   2. 备份就是打包 /opt/kuaiban 一个目录（数据库 + 发布包 + 签名密钥都在这儿）
      #   命名卷还得进容器里拷，运维上麻烦得多。
      - /opt/kuaiban/data:/data

    restart: unless-stopped

    # 日志别无限涨：内部工具，30MB 足够回看问题了
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
